<text x="420" y="81.25" font-size="10" text-anchor="start" font-weight="normal" fill="#5b6573">validates calls, tracks state,</text>
<text x="420" y="93.75" font-size="10" text-anchor="start" font-weight="normal" fill="#5b6573">manages resources</text>
<line x1="392" y1="130" x2="412" y2="130" stroke="#d5dae2" stroke-width="0.9"/>
<text x="420" y="127.25" font-size="10" text-anchor="start" font-weight="normal" fill="#5b6573">(API runtime / UMD boundary is</text>
<text x="420" y="139.75" font-size="10" text-anchor="start" font-weight="normal" fill="#5b6573">blurrier in OpenGL)</text>
<line x1="392" y1="176" x2="412" y2="176" stroke="#d5dae2" stroke-width="0.9"/>
<text x="420" y="173.25" font-size="10" text-anchor="start" font-weight="normal" fill="#5b6573">compiles shaders, translates state,</text>
<text x="420" y="185.75" font-size="10" text-anchor="start" font-weight="normal" fill="#5b6573">writes command (DMA) buffers</text>
<line x1="392" y1="250" x2="412" y2="250" stroke="#d5dae2" stroke-width="0.9"/>
<text x="420" y="247.25" font-size="10" text-anchor="start" font-weight="normal" fill="#5b6573">time-slices the GPU between apps;</text>
<text x="420" y="259.75" font-size="10" text-anchor="start" font-weight="normal" fill="#5b6573">context switch = extra commands</text>
<line x1="392" y1="296" x2="412" y2="296" stroke="#d5dae2" stroke-width="0.9"/>
<text x="420" y="293.25" font-size="10" text-anchor="start" font-weight="normal" fill="#5b6573">maps memory, owns the main ring</text>
<text x="420" y="305.75" font-size="10" text-anchor="start" font-weight="normal" fill="#5b6573">buffer, updates read/write pointers</text>
<line x1="392" y1="364" x2="412" y2="364" stroke="#d5dae2" stroke-width="0.9"/>
<text x="420" y="367.5" font-size="10" text-anchor="start" font-weight="normal" fill="#5b6573">DMA transfers and pointer writes</text>
<line x1="392" y1="412" x2="412" y2="412" stroke="#d5dae2" stroke-width="0.9"/>
<text x="420" y="415.5" font-size="10" text-anchor="start" font-weight="normal" fill="#5b6573">reads the commands (Part 2)</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>