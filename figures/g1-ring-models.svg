<text x="156" y="72" font-size="10" text-anchor="middle" font-weight="normal" fill="#b5562a">WritePos = 2</text>
<text x="468" y="96.75" font-size="10" text-anchor="start" font-weight="normal" fill="#1d2a44">count = WritePos + SIZE − ReadPos = 4</text>
<text x="468" y="109.25" font-size="10" text-anchor="start" font-weight="normal" fill="#1d2a44">(case distinction when wrapped);</text>
<text x="468" y="121.75" font-size="10" text-anchor="start" font-weight="normal" fill="#1d2a44">full and empty both give Read = Write,</text>
<text x="468" y="134.25" font-size="10" text-anchor="start" font-weight="normal" fill="#1d2a44">so stop at SIZE − 1 elements</text>
