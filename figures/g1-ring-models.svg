<text x="468" y="226.75" font-size="10" text-anchor="start" font-weight="normal" fill="#1d2a44">count = WritePos − ReadPos = 4 (always)</text>
<text x="468" y="239.25" font-size="10" text-anchor="start" font-weight="normal" fill="#1d2a44">slot = Pos mod SIZE (cheap for 2ⁿ);</text>
<text x="468" y="251.75" font-size="10" text-anchor="start" font-weight="normal" fill="#1d2a44">full = (WritePos − ReadPos == SIZE),</text>
<text x="468" y="264.25" font-size="10" text-anchor="start" font-weight="normal" fill="#1d2a44">no ambiguity</text>
<text x="360" y="312" font-size="10" text-anchor="middle" font-weight="normal" fill="#5b6573" font-style="italic">Same buffer state (SIZE = 8, 4 elements stored, wrapped around), described by two index models.</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>